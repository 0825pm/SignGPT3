# =============================================================================
# SignGPT3 HML-style VAE Training Config
# =============================================================================
#
# [이전 실수 반영]
#   1. LAMBDA_KL: 1e-5 → 1e-4  (stagnation 원인)
#   2. MEAN_PATH: CSL-Daily    → 통합 mean/std (preprocess 후 생성)
#   3. FEATURE_TYPE: soke      → hml_style (position 기반, FK 불필요)
#   4. LAMBDA_VELOCITY: 0.0    → 249-dim 지원 전까지 0 유지
#   5. VAL_EVERY_STEPS: 10     → 20으로 늘림 (HML은 val 빠름)
# =============================================================================

NAME: SignGPT3_vae_hml249
DEBUG: False
ACCELERATOR: 'gpu'
NUM_NODES: 1
DEVICE: [1]
FOLDER: experiments
FOLDER_EXP: experiments/motgpt

LOGGER:
  TYPE: ['WandbLogger']
  PROJECT: signgpt3
  OFFLINE: True
  SAVE_DIR: experiments/motgpt/logs
  VAL_EVERY_STEPS: 20

TRAIN:
  STAGE: vae
  BATCH_SIZE: 128
  END_EPOCH: 2000
  RESUME: ''
  PRETRAINED: ''
  PRETRAINED_VAE: ''
  NUM_WORKERS: 8
  instruction_type: 'caption'

  OPTIM:
    target: AdamW
    params:
      lr: 2e-4
      betas: [0.9, 0.99]
      weight_decay: 1e-4

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: 2000
      eta_min: 1e-6

EVAL:
  SPLIT: val
  BATCH_SIZE: 32
  NUM_WORKERS: 4

TEST:
  SPLIT: test
  BATCH_SIZE: 32
  SAVE_PREDICTIONS: False
  CHECKPOINTS: ''
  REP_I: 0
  NUM_WORKERS: 4

# =============================================================================
# Dataset
# =============================================================================
DATASET:
  target: motGPT.data.H2S.H2SDataModule
  JOINT_TYPE: smplx
  NFEATS: 249
  NJOINTS: 55
  FEATURE_TYPE: hml_style    # H2S.py에서 npy 로딩 경로 사용

  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: /home/user/Projects/research/SOKE/data/How2Sign
    CSL_ROOT: /home/user/Projects/research/SOKE/data/CSL-Daily
    PHOENIX_ROOT: /home/user/Projects/research/SOKE/data/Phoenix_2014T

    # 3개 데이터셋 통합 통계 (preprocess_soke_to_hml.py 실행 시 생성)
    HML_ROOT:  /home/user/Projects/research/SOKE/data_hml
    MEAN_PATH: /home/user/Projects/research/SOKE/data_hml/mean.npy
    STD_PATH:  /home/user/Projects/research/SOKE/data_hml/std.npy

    FPS: 25
    MAX_MOTION_LEN: 300
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 40
    UNIT_LEN: 4

# =============================================================================
# Metrics
# =============================================================================
METRIC:
  TYPE: ['MRMetrics']
  DIST_SYNC_ON_STEP: True
  DIVERSITY_TIMES: 300
  MM_NUM_TIMES: 10
  MM_NUM_REPEATS: 30

# =============================================================================
# Loss
# =============================================================================
LOSS:
  LAMBDA_REC: 1.0
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.5      # losses/motgpt.py가 249-dim velocity 미지원 → 0
  LAMBDA_KL: 1e-4            # 핵심 수정: 1e-5 → 1e-4 (100배 증가)
  LAMBDA_LATENT: 1e-5
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  LAMBDA_DIFF: 1.0
  ABLATION:
    RECONS_LOSS: l1_smooth

# =============================================================================
# Model
# =============================================================================
model:
  target: motGPT.models.motgpt.MotGPT
  params:
    lm: null
    motion_vae: ${vae.mldvae}
    stage: vae
    debug: ${DEBUG}
    task: t2m
    condition: text
    metrics_dict: ${METRIC.TYPE}
    guidance_scale: 1.0
    codebook_size: 512

vae:
  mldvae:
    target: motGPT.archs.mld_vae.MldVae
    params:
      nfeats: ${DATASET.NFEATS}   # 249
      latent_dim: [1, 256]
      ff_size: 1024
      num_layers: 9
      num_heads: 4
      dropout: 0.1
      activation: gelu
      arch: encoder_decoder
      normalize_before: false
      position_embedding: learned
      code_num: 512
      datatype: h2s
      ablation: ${ABLATION}

ABLATION:
  VAE_TYPE: mld
  VAE_ARCH: encoder_decoder
  PE_TYPE: mld
  DIFF_PE_TYPE: mld
  SKIP_CONNECT: True
  MLP_DIST: False
  IS_DIST: False
  PREDICT_EPSILON: True

SEED_VALUE: 1234
FULL_CONFIG: false