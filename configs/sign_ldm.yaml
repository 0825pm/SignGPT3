# =============================================================================
# configs/sign_ldm.yaml
# SignGPT3 Light Latent Diffusion Model 학습 config
# =============================================================================
#
# Prerequisites:
#   - 학습 완료된 VAE checkpoint (sign_vae_hml.yaml)
#
# Usage:
#   python train.py --cfg configs/sign_ldm.yaml --nodebug \
#     TRAIN.PRETRAINED_VAE=experiments/motgpt/SignGPT3_vae_hml249/checkpoints/last.ckpt
#
# noise_scheduler.prediction_type 기본값은 'epsilon' (DDPM_ori.yaml)
# x_0 직접 예측 학습을 원하면 아래 DIFFUSION 섹션에서 override:
#   DIFFUSION.PREDICTION_TYPE: sample
# =============================================================================

NAME: SignGPT3_ldm
DEBUG: False
ACCELERATOR: 'gpu'
USE_GPUS: "0"          # os.environ['CUDA_VISIBLE_DEVICES'] 에 사용
NUM_NODES: 1
DEVICE: [0]
FOLDER: experiments
FOLDER_EXP: experiments/motgpt

# =============================================================================
# Logger
# =============================================================================
LOGGER:
  TYPE: ['WandbLogger']
  PROJECT: signgpt3
  OFFLINE: True
  SAVE_DIR: experiments/motgpt/logs
  VAL_EVERY_STEPS: 10

# =============================================================================
# Training
# =============================================================================
TRAIN:
  STAGE: ldm
  BATCH_SIZE: 256
  END_EPOCH: 2000
  RESUME: ''
  PRETRAINED: ''
  PRETRAINED_VAE: ''    # ← 실행 시 반드시 지정
  NUM_WORKERS: 8
  instruction_type: 'caption'

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.999]
      weight_decay: 1e-4

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: 2000
      eta_min: 1e-6

# =============================================================================
# Eval / Test
# =============================================================================
EVAL:
  SPLIT: val
  BATCH_SIZE: 64
  NUM_WORKERS: 4

TEST:
  SPLIT: test
  BATCH_SIZE: 64
  SAVE_PREDICTIONS: False
  CHECKPOINTS: ''
  REP_I: 0
  NUM_WORKERS: 4

# =============================================================================
# Dataset (VAE와 동일하게 유지)
# =============================================================================
DATASET:
  target: motGPT.data.H2S.H2SDataModule
  JOINT_TYPE: smplx
  NFEATS: 249                   # HML-style (sign_vae_hml.yaml과 동일)
  NJOINTS: 55
  FEATURE_TYPE: hml_style

  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: /home/user/Projects/research/SOKE/data/How2Sign
    CSL_ROOT: /home/user/Projects/research/SOKE/data/CSL-Daily
    PHOENIX_ROOT: /home/user/Projects/research/SOKE/data/Phoenix_2014T
    HML_ROOT: /home/user/Projects/research/SOKE/data_hml
    MEAN_PATH: /home/user/Projects/research/SOKE/data_hml/mean.npy
    STD_PATH: /home/user/Projects/research/SOKE/data_hml/std.npy
    FPS: 25
    MAX_MOTION_LEN: 300
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 40
    UNIT_LEN: 4

# =============================================================================
# Diffusion Schedulers
# =============================================================================
DIFFUSION:
  # 학습: DDPM + x_0 예측 (Light-T2M 방식)
  # prediction_type: 'sample' → target = z_clean
  # prediction_type: 'epsilon' → target = noise  (기본값)
  PREDICTION_TYPE: sample       # ← x_0 예측 학습 권장

  NUM_TRAIN_TIMESTEPS: 1000
  BETA_START: 0.0001
  BETA_END: 0.02
  BETA_SCHEDULE: linear

  # 추론: UniPC 10 step (항상 epsilon space)
  SAMPLE_STEPS: 10

# =============================================================================
# Metrics
# =============================================================================
METRIC:
  TYPE: ['MRMetrics']
  DIST_SYNC_ON_STEP: True
  DIVERSITY_TIMES: 300
  MM_NUM_TIMES: 10
  MM_NUM_REPEATS: 30

# =============================================================================
# Loss
# =============================================================================
LOSS:
  LAMBDA_REC: 1.0
  LAMBDA_FEATURE: 0.0       # LDM에서는 feature loss 불필요
  LAMBDA_VELOCITY: 0.0
  LAMBDA_KL: 0.0            # VAE frozen이므로 KL 불필요
  LAMBDA_LATENT: 1.0        # latent diffusion MSE loss
  LAMBDA_COMMIT: 0.0
  LAMBDA_CLS: 0.0
  LAMBDA_DIFF: 0.0
  ABLATION:
    RECONS_LOSS: l2

# =============================================================================
# Model
# =============================================================================
model:
  target: motGPT.models.light_ldm.LightLDM
  params:
    stage: ldm
    guidance_scale: 4.0
    text_replace_prob: 0.1
    step_num: 10
    metrics_dict: ${METRIC.TYPE}
    motion_vae: ${vae.mldvae}
    text_encoder: ${text_encoder.clip}
    denoiser: ${denoiser.sign_latent}

# =============================================================================
# VAE (frozen) - sign_vae_hml.yaml과 동일한 구조
# =============================================================================
vae:
  mldvae:
    target: motGPT.archs.mld_vae.MldVae
    params:
      nfeats: ${DATASET.NFEATS}
      latent_dim: [1, 256]
      ff_size: 1024
      num_layers: 9
      num_heads: 4
      dropout: 0.1
      activation: gelu
      arch: encoder_decoder
      normalize_before: false
      position_embedding: learned
      code_num: 512
      datatype: h2s
      ablation: ${ABLATION}

# =============================================================================
# Text Encoder (frozen) - CLIP ViT-B/32
# =============================================================================
text_encoder:
  clip:
    target: motGPT.archs.clip_encoder.CLIPTextEncoder
    params:
      freeze: true

# =============================================================================
# Denoiser (trainable) - SignLatentDenoiser
# =============================================================================
denoiser:
  sign_latent:
    target: motGPT.archs.light_denoiser.SignLatentDenoiser
    params:
      latent_dim: 256
      text_dim: 512
      hidden_dim: 512
      num_blocks: 8
      dropout: 0.1
      ffn_expand: 4
      freq_dim: 256

# =============================================================================
# Ablation (MldVae 호환용)
# =============================================================================
ABLATION:
  VAE_TYPE: mld
  VAE_ARCH: encoder_decoder
  PE_TYPE: mld
  DIFF_PE_TYPE: mld
  SKIP_CONNECT: True
  MLP_DIST: False
  IS_DIST: False
  PREDICT_EPSILON: True

SEED_VALUE: 1234
FULL_CONFIG: false